<title>Carnet du jour</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #dcdbe3;
  --paper: #eeedf3;
  --ink: #322da3;
  --ink-deep: #221c8a;
  --ink-light: #9d9ae0;
  --ink-pale: #c9c6ee;
  --white: #ffffff;
  --text-soft: #6b699a;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Space Mono', monospace;
  height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app {
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 26px 16px 110px;
  position: relative;
  min-height: 100vh;
}

.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

/* ---------- Bottom nav ---------- */
.bottom-nav {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: var(--paper);
  border-radius: 30px;
  padding: 6px;
  border: 1.5px solid var(--ink-pale);
  box-shadow: 0 8px 22px rgba(34,28,138,0.16);
  z-index: 40;
}
.nav-btn {
  width: 58px;
  height: 48px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink);
  background: transparent;
}
.nav-btn.active { background: var(--ink); color: var(--white); }
.nav-btn svg { width: 22px; height: 22px; }

/* ---------- Day screen ---------- */
.day-label {
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 22px;
}

.filmstrip-wrap {
  position: relative;
  height: 92px;
  margin: 0 -16px 14px;
  overflow: hidden;
}

.center-marker {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 76px;
  height: 76px;
  background: var(--ink-pale);
  border-radius: 22px;
  box-shadow: 0 8px 16px rgba(34,28,138,0.2);
  pointer-events: none;
  z-index: 1;
}

.filmstrip {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding: 0 calc(50% - 19px);
  scrollbar-width: none;
}
.filmstrip::-webkit-scrollbar { display: none; }

.film-cell {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  scroll-snap-align: center;
  transition: width 0.15s ease, height 0.15s ease, background 0.15s ease;
}
.film-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-light); }
.film-cell img { width: 68%; height: 68%; object-fit: contain; mix-blend-mode: multiply; }

.film-cell.selected { width: 70px; height: 70px; background: var(--ink-pale); border-radius: 22px; }
.film-cell.selected img { width: 60%; height: 60%; filter: none; }
.film-cell.selected .dot { width: 8px; height: 8px; background: var(--ink); }

.day-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 0 10px;
}

.plant-cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  cursor: pointer;
}
.plant-circle svg { width: 84px; height: 84px; }
.plant-label {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.entry-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 100%;
}
.entry-view { position: relative; }
.entry-view img {
  width: 220px;
  height: 220px;
  object-fit: contain;
  mix-blend-mode: multiply;
}
.entry-date {
  font-size: 12px;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.entry-text {
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  line-height: 1.5;
  text-align: center;
  max-width: 280px;
  margin: 0;
  white-space: pre-wrap;
}
.entry-edit {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink);
  text-decoration: underline;
  cursor: pointer;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.empty-past {
  text-align: center;
  color: var(--text-soft);
  font-family: 'Inter', sans-serif;
}
.empty-past .dash { font-size: 30px; margin-bottom: 8px; color: var(--ink-light); }
.empty-past p { font-size: 13px; margin: 0; }

/* ---------- Year screen ---------- */
.year-pill-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
.year-pill {
  color: var(--ink);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 1px;
}
.garden-sub {
  text-align: center;
  font-size: 11px;
  color: var(--text-soft);
  font-family: 'Inter', sans-serif;
  margin-bottom: 18px;
}
.daygrid {
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  gap: 4px;
}
.day-cell {
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.day-cell.clickable { cursor: pointer; }
.day-cell .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-light); }
.day-cell.today .dot { background: var(--ink); width: 6px; height: 6px; box-shadow: 0 0 0 2px var(--ink-pale); }
.day-cell img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }

.loading, .empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-soft);
  font-size: 12.5px;
  font-family: 'Inter', sans-serif;
}
.empty-state .doodle { font-size: 30px; margin-bottom: 8px; }
.empty-state p { max-width: 260px; margin: 0 auto; line-height: 1.5; }

/* ---------- Draw screen ---------- */
.draw-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: 12px;
  border: 1.5px solid var(--ink-pale);
  background: var(--white);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.draw-date {
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-soft);
}

.canvas-wrap {
  position: relative;
  background: var(--white);
  border-radius: 22px;
  border: 2.5px solid var(--ink);
  overflow: hidden;
  margin-bottom: 14px;
  touch-action: none;
}
canvas { display: block; width: 100%; aspect-ratio: 1/1; touch-action: none; }

.saved-badge {
  position: absolute; top: 10px; right: 10px;
  background: var(--ink); color: var(--white);
  font-size: 10.5px; font-weight: 700;
  padding: 5px 12px; border-radius: 20px;
  display: none; align-items: center; gap: 4px; letter-spacing: 0.3px;
}
.saved-badge.show { display: inline-flex; }

.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.swatches { display: flex; gap: 8px; flex: 1; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
.swatch.selected { border-color: var(--ink); transform: scale(1.15); }

.tool-btn {
  width: 36px; height: 36px; border-radius: 12px;
  border: 1.5px solid var(--ink-pale); background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; font-size: 15px; color: var(--ink);
}
.tool-btn.on { background: var(--ink); color: var(--white); }

.brush-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.brush-row input[type=range] { flex: 1; accent-color: var(--ink); }
.text-field-label {
  font-size: 10.5px;
  color: var(--text-soft);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 8px;
  font-family: 'Space Mono', monospace;
}
.text-field {
  width: 100%;
  border: 1.5px solid var(--ink-pale);
  border-radius: 16px;
  background: var(--white);
  padding: 12px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  resize: vertical;
  min-height: 60px;
  margin-bottom: 16px;
}
.text-field:focus { outline: none; border-color: var(--ink); }
.text-field::placeholder { color: var(--ink-light); }
.brush-label { font-size: 10.5px; color: var(--text-soft); font-weight: 700; width: 68px; text-transform: uppercase; letter-spacing: 0.4px; }

.save-btn {
  width: 100%; padding: 15px; border-radius: 30px; border: none;
  background: var(--ink); color: var(--white);
  font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13.5px;
  cursor: pointer; letter-spacing: 0.6px; text-transform: uppercase;
}
.hint { text-align: center; font-size: 11.5px; color: var(--text-soft); margin-top: 12px; font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div class="app">

  <!-- DAY SCREEN -->
  <div class="screen active" id="screen-day">
    <div class="day-label" id="dayLabel">Aujourd'hui</div>
    <div class="filmstrip-wrap">
      <div class="center-marker"></div>
      <div class="filmstrip" id="filmstrip"></div>
    </div>
    <div class="day-main" id="dayMain"></div>
  </div>

  <!-- YEAR SCREEN -->
  <div class="screen" id="screen-year">
    <div class="year-pill-wrap"><div class="year-pill" id="yearPill">2026</div></div>
    <div class="garden-sub" id="gardenSub"></div>
    <div id="gardenContent"><div class="loading">Chargement…</div></div>
  </div>

  <!-- DRAW SCREEN -->
  <div class="screen" id="screen-draw">
    <div class="draw-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="draw-date" id="drawDate"></div>
      <div style="width:36px"></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="saved-badge" id="savedBadge">✓ Enregistré</div>
    </div>
    <div class="toolbar">
      <div class="swatches" id="swatches"></div>
      <button class="tool-btn" id="undoBtn" title="Annuler">↩︎</button>
      <button class="tool-btn" id="eraseBtn" title="Gomme">▢</button>
      <button class="tool-btn" id="clearBtn" title="Tout effacer">✕</button>
    </div>
    <div class="brush-row">
      <span class="brush-label">Épaisseur</span>
      <input type="range" id="brushSize" min="2" max="22" value="6">
    </div>
    <div class="text-field-label">Raconte ta journée (optionnel)</div>
    <textarea class="text-field" id="entryText" placeholder="Qu'est-ce qui a marqué ta journée ?" rows="3"></textarea>
    <button class="save-btn" id="saveBtn">Enregistrer le dessin</button>
    <div class="hint" id="hintText">Un petit dessin suffit — même trois traits racontent une journée.</div>
  </div>

</div>

<div class="bottom-nav" id="bottomNav">
  <div class="nav-btn" id="navYear" data-screen="year" title="Année">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.7"/><circle cx="12" cy="6" r="1.7"/><circle cx="18" cy="6" r="1.7"/><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/><circle cx="6" cy="18" r="1.7"/><circle cx="12" cy="18" r="1.7"/><circle cx="18" cy="18" r="1.7"/></svg>
  </div>
  <div class="nav-btn active" id="navDay" data-screen="day" title="Jour">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="2.1"/>
      <circle cx="12" cy="5.3" r="2.6"/>
      <circle cx="12" cy="18.7" r="2.6"/>
      <circle cx="5.3" cy="12" r="2.6"/>
      <circle cx="18.7" cy="12" r="2.6"/>
    </svg>
  </div>
</div>

<script>
/* ---------------- Stockage local (autonome, sans Claude) ---------------- */
(function() {
  const PREFIX = 'carnet_du_jour__';
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error('Key not found: ' + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem(PREFIX + key, value);
      } catch (err) {
        throw new Error('Storage quota exceeded or unavailable');
      }
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX)) {
          const stripped = k.slice(PREFIX.length);
          if (!prefix || stripped.startsWith(prefix)) keys.push(stripped);
        }
      }
      return { keys, prefix, shared: !!shared };
    }
  };
})();

const COLORS = ['#322da3', '#5b56c9', '#9d9ae0', '#221c8a', '#7a76d1', '#ffffff'];
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let drawing = false;
let currentColor = COLORS[0];
let erasing = false;
let brushSize = 6;
let history = [];
let todayKey = null;
let drawTargetKey = null;    // clé du jour en cours d'édition sur l'écran de dessin
let lastPos = null;
let entryCache = {};        // dateStr -> dataUrl
let entryTextCache = {};    // dateStr -> texte de description
let selectedDate = new Date();

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function pad(n) { return String(n).padStart(2, '0'); }
function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateKey(d) { return `day:${toDateStr(d)}`; }
function isSameDay(a, b) { return toDateStr(a) === toDateStr(b); }
function todayStr() { return toDateStr(new Date()); }

const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function shortLabel(d) {
  if (isSameDay(d, new Date())) return "Aujourd'hui";
  const y = new Date(); y.setDate(y.getDate()-1);
  if (isSameDay(d, y)) return 'Hier';
  return `${d.getDate()} ${MOIS[d.getMonth()]}`;
}
function fullLabel(d) {
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

/* ---------------- Canvas drawing ---------------- */
function setupCanvasSize() {
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  ctx.scale(ratio, ratio);
  paintBackground();
}
function paintBackground() {
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width, canvas.height);
  ctx.restore();
}
function pushHistory() {
  history.push(canvas.toDataURL('image/png'));
  if (history.length > 25) history.shift();
}
function restoreFromDataUrl(url, cb) {
  const img = new Image();
  img.onload = () => {
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.restore();
    if (cb) cb();
  };
  img.src = url;
}
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  return { x: clientX - rect.left, y: clientY - rect.top };
}
function startDraw(e) { e.preventDefault(); pushHistory(); drawing = true; lastPos = getPos(e); drawDot(lastPos); }
function drawDot(pos) {
  ctx.beginPath();
  ctx.fillStyle = erasing ? '#ffffff' : currentColor;
  ctx.arc(pos.x, pos.y, brushSize/2, 0, Math.PI*2);
  ctx.fill();
}
function moveDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.strokeStyle = erasing ? '#ffffff' : currentColor;
  ctx.lineWidth = brushSize; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(lastPos.x, lastPos.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
  lastPos = pos;
  hideSavedBadge();
}
function endDraw(e) { if (drawing) e && e.preventDefault(); drawing = false; lastPos = null; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', moveDraw, {passive:false});
canvas.addEventListener('touchend', endDraw, {passive:false});

function buildSwatches() {
  const wrap = document.getElementById('swatches');
  COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i===0 ? ' selected' : '');
    el.style.background = c;
    el.style.boxShadow = c === '#ffffff' ? 'inset 0 0 0 1.5px #c9c6ee' : 'none';
    el.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      currentColor = c; erasing = false;
      document.getElementById('eraseBtn').classList.remove('on');
    });
    wrap.appendChild(el);
  });
}
document.getElementById('brushSize').addEventListener('input', e => brushSize = parseInt(e.target.value, 10));
document.getElementById('undoBtn').addEventListener('click', () => {
  if (!history.length) return;
  restoreFromDataUrl(history.pop());
  hideSavedBadge();
});
document.getElementById('eraseBtn').addEventListener('click', e => {
  erasing = !erasing;
  e.currentTarget.classList.toggle('on', erasing);
});
document.getElementById('clearBtn').addEventListener('click', () => { pushHistory(); paintBackground(); hideSavedBadge(); });
function hideSavedBadge() { document.getElementById('savedBadge').classList.remove('show'); }
function showSavedBadge() { document.getElementById('savedBadge').classList.add('show'); }
function showSaveError() {
  const hint = document.getElementById('hintText');
  hint.textContent = "La sauvegarde a échoué — vérifie ta connexion et réessaie.";
  hint.style.color = '#c94a4a';
  hint.style.fontWeight = '700';
  setTimeout(() => {
    hint.textContent = 'Un petit dessin suffit — même trois traits racontent une journée.';
    hint.style.color = '';
    hint.style.fontWeight = '';
  }, 4000);
}

async function saveEntry() {
  const btn = document.getElementById('saveBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Enregistrement…';
  btn.disabled = true;
  try {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    const targetDs = drawTargetKey.replace('day:', '');
    const text = document.getElementById('entryText').value.trim();
    const result = await window.storage.set(drawTargetKey, JSON.stringify({ dataUrl, text, savedAt: new Date().toISOString() }), false);
    if (!result) throw new Error('Storage returned no result');
    entryCache[targetDs] = dataUrl;
    entryTextCache[targetDs] = text;
    showSavedBadge();
    btn.textContent = originalText;
    btn.disabled = false;
    setTimeout(() => { showScreen('day'); renderDayScreen(); }, 450);
  } catch (err) {
    console.error('Erreur de sauvegarde', err);
    btn.textContent = originalText;
    btn.disabled = false;
    showSaveError();
  }
}
document.getElementById('saveBtn').addEventListener('click', saveEntry);

async function loadEntryIntoCanvas() {
  const textField = document.getElementById('entryText');
  textField.value = '';
  try {
    const res = await window.storage.get(drawTargetKey, false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      restoreFromDataUrl(parsed.dataUrl, () => showSavedBadge());
      textField.value = parsed.text || '';
    } else { hideSavedBadge(); }
  } catch (err) { hideSavedBadge(); }
}

/* ---------------- Screens ---------------- */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('bottomNav').style.display = name === 'draw' ? 'none' : 'flex';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
}
document.getElementById('navDay').addEventListener('click', () => { showScreen('day'); renderDayScreen(); });
document.getElementById('navYear').addEventListener('click', () => { showScreen('year'); loadGarden(); });
document.getElementById('backBtn').addEventListener('click', () => { showScreen('day'); renderDayScreen(); });

function openDraw() {
  drawTargetKey = dateKey(selectedDate);
  document.getElementById('drawDate').textContent = shortLabel(selectedDate);
  showScreen('draw');
  setupCanvasSize();
  loadEntryIntoCanvas();
}

/* ---------------- Day screen rendering ---------------- */
async function ensureEntriesLoaded() {
  try {
    const list = await window.storage.list('day:', false);
    const keys = (list && list.keys) ? list.keys : [];
    await Promise.all(keys.map(async k => {
      const ds = k.replace('day:', '');
      if (entryCache[ds] !== undefined) return;
      try {
        const r = await window.storage.get(k, false);
        const parsed = JSON.parse(r.value);
        entryCache[ds] = parsed.dataUrl;
        entryTextCache[ds] = parsed.text || '';
      } catch {}
    }));
  } catch (err) {
    console.error('Impossible de charger le carnet', err);
  }
  return entryCache;
}

let scrollTicking = false;

function updateSelectionFromScroll() {
  const strip = document.getElementById('filmstrip');
  const wrapRect = strip.getBoundingClientRect();
  const centerX = wrapRect.left + wrapRect.width / 2;
  let closest = null, closestDist = Infinity;
  strip.querySelectorAll('.film-cell').forEach(cell => {
    const r = cell.getBoundingClientRect();
    const dist = Math.abs((r.left + r.width / 2) - centerX);
    if (dist < closestDist) { closestDist = dist; closest = cell; }
  });
  if (!closest) return;
  strip.querySelectorAll('.film-cell').forEach(c => c.classList.toggle('selected', c === closest));
  const ds = closest.dataset.date;
  if (ds !== toDateStr(selectedDate)) {
    selectedDate = new Date(ds + 'T12:00:00');
    renderDayMain();
  }
}

function buildFilmstrip() {
  const strip = document.getElementById('filmstrip');
  strip.innerHTML = '';
  const days = 60;
  const today = new Date();
  const cells = [];
  for (let i = days; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    cells.push(d);
  }
  cells.forEach(d => {
    const ds = toDateStr(d);
    const cell = document.createElement('div');
    cell.className = 'film-cell' + (isSameDay(d, selectedDate) ? ' selected' : '');
    cell.dataset.date = ds;
    if (entryCache[ds]) {
      const img = document.createElement('img');
      img.src = entryCache[ds];
      cell.appendChild(img);
    } else {
      const dot = document.createElement('div');
      dot.className = 'dot';
      cell.appendChild(dot);
    }
    cell.addEventListener('click', () => {
      cell.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    });
    strip.appendChild(cell);
  });

  strip.removeEventListener('scroll', onFilmstripScroll);
  strip.addEventListener('scroll', onFilmstripScroll, { passive: true });

  const target = strip.querySelector(`[data-date="${toDateStr(selectedDate)}"]`);
  requestAnimationFrame(() => {
    if (target) target.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  });
}

function onFilmstripScroll() {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => { updateSelectionFromScroll(); scrollTicking = false; });
}

function renderDayMain() {
  const main = document.getElementById('dayMain');
  const ds = toDateStr(selectedDate);
  document.getElementById('dayLabel').textContent = shortLabel(selectedDate);

  if (entryCache[ds]) {
    main.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'entry-view';
    const text = entryTextCache[ds];
    wrap.innerHTML = `
      <img src="${entryCache[ds]}">
      <div class="entry-date">${fullLabel(selectedDate)}</div>
      ${text ? `<p class="entry-text">${escapeHtml(text)}</p>` : ''}
      <div class="entry-edit" id="editBtn">Modifier</div>
    `;
    main.appendChild(wrap);
    document.getElementById('editBtn').addEventListener('click', openDraw);
  } else {
    main.innerHTML = `
      <div class="plant-cta" id="plantBtn">
        <div class="plant-circle">
          <svg viewBox="0 0 120 120" fill="none" stroke="#322da3" stroke-width="4" stroke-linecap="round">
            <path d="M60,10 C90,8 112,34 110,61 C108,90 83,112 55,110 C25,108 8,80 10,52 C12,25 33,12 60,10 Z"/>
            <line x1="60" y1="42" x2="60" y2="78"/>
            <line x1="42" y1="60" x2="78" y2="60"/>
          </svg>
        </div>
        <div class="plant-label">Planter mon souvenir</div>
      </div>`;
    document.getElementById('plantBtn').addEventListener('click', openDraw);
  }
}

async function renderDayScreen(refresh = true) {
  if (refresh) await ensureEntriesLoaded();
  buildFilmstrip();
  renderDayMain();
}

/* ---------------- Year screen ---------------- */
function isLeap(y) { return (y%4===0 && y%100!==0) || y%400===0; }
function daysInYear(y) { return isLeap(y) ? 366 : 365; }

async function loadGarden() {
  const content = document.getElementById('gardenContent');
  content.innerHTML = '<div class="loading">Chargement…</div>';
  const now = new Date();
  const year = now.getFullYear();
  document.getElementById('yearPill').textContent = year;
  await ensureEntriesLoaded();

  const count = Object.keys(entryCache).filter(k => k.startsWith(String(year))).length;
  if (!count) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="doodle">🌱</div>
        <p>Ton jardin est encore vide. Reviens sur "Aujourd'hui" pour planter ton premier souvenir.</p>
      </div>`;
    document.getElementById('gardenSub').textContent = "chaque point est un jour de l'année";
    return;
  }
  document.getElementById('gardenSub').textContent = `${count} dessin${count>1?'s':''} cette année`;

  const total = daysInYear(year);
  const tStr = todayStr();
  const grid = document.createElement('div');
  grid.className = 'daygrid';

  for (let i = 0; i < total; i++) {
    const d = new Date(year, 0, 1 + i);
    const ds = toDateStr(d);
    const cell = document.createElement('div');
    const isToday = ds === tStr;
    cell.className = 'day-cell' + (isToday ? ' today' : '');
    if (entryCache[ds]) {
      cell.classList.add('clickable');
      const img = document.createElement('img');
      img.src = entryCache[ds];
      cell.appendChild(img);
      cell.addEventListener('click', () => { selectedDate = new Date(d); showScreen('day'); renderDayScreen(false); });
    } else if (ds <= tStr) {
      cell.classList.add('clickable');
      const dot = document.createElement('div');
      dot.className = 'dot';
      cell.appendChild(dot);
      cell.addEventListener('click', () => { selectedDate = new Date(d); showScreen('day'); renderDayScreen(false); });
    } else {
      const dot = document.createElement('div');
      dot.className = 'dot';
      cell.appendChild(dot);
    }
    grid.appendChild(cell);
  }
  content.innerHTML = '';
  content.appendChild(grid);
}

/* ---------------- Init ---------------- */
function init() {
  const now = new Date();
  todayKey = dateKey(now);
  buildSwatches();
  renderDayScreen(true);
  window.addEventListener('resize', () => {
    if (!document.getElementById('screen-draw').classList.contains('active')) return;
    const snapshot = canvas.toDataURL('image/png');
    setupCanvasSize();
    restoreFromDataUrl(snapshot);
  });
}
init();
</script>
</body>
</html>
