<title>Carnet du jour</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #dcdbe3;
  --paper: #eeedf3;
  --ink: #322da3;
  --ink-deep: #221c8a;
  --ink-light: #9d9ae0;
  --ink-pale: #c9c6ee;
  --white: #ffffff;
  --text-soft: #6b699a;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Space Mono', monospace;
  height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app {
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 26px 16px 110px;
  position: relative;
  min-height: 100vh;
}

.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

/* ---------- Bottom nav ---------- */
.bottom-nav {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: var(--paper);
  border-radius: 30px;
  padding: 6px;
  border: 1.5px solid var(--ink-pale);
  box-shadow: 0 8px 22px rgba(34,28,138,0.16);
  z-index: 40;
}
.nav-btn {
  width: 58px;
  height: 48px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink);
  background: transparent;
}
.nav-btn.active { background: var(--ink); color: var(--white); }
.nav-btn svg { width: 22px; height: 22px; }

/* ---------- Day screen ---------- */
.day-label {
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 22px;
}

.filmstrip-wrap {
  position: relative;
  height: 92px;
  margin: 0 -16px 14px;
  overflow: hidden;
}

.center-marker {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 76px;
  height: 76px;
  background: var(--ink-pale);
  border-radius: 22px;
  box-shadow: 0 8px 16px rgba(34,28,138,0.2);
  pointer-events: none;
  z-index: 1;
}

.filmstrip {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding: 0 calc(50% - 19px);
  scrollbar-width: none;
}
.filmstrip::-webkit-scrollbar { display: none; }

.film-cell {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  scroll-snap-align: center;
  transition: width 0.15s ease, height 0.15s ease;
}
.film-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-light); }
.film-cell img { width: 68%; height: 68%; object-fit: contain; filter: grayscale(1) brightness(1.15) sepia(1) hue-rotate(215deg) saturate(4.5) contrast(1.05); }

.film-cell.selected { width: 70px; height: 70px; }
.film-cell.selected img { width: 60%; height: 60%; filter: none; }
.film-cell.selected .dot { width: 8px; height: 8px; background: var(--ink); }

.day-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 0 10px;
}

.plant-cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  cursor: pointer;
}
.plant-circle svg { width: 84px; height: 84px; }
.plant-label {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.entry-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 100%;
}
.entry-view { position: relative; }
.entry-view img {
  width: 220px;
  height: 220px;
  object-fit: contain;
  background: var(--white);
  border-radius: 24px;
  border: 2.5px solid var(--ink);
}
.entry-fab {
  position: absolute;
  top: -8px;
  right: calc(50% - 110px - 8px);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(34,28,138,0.3);
}
.entry-date {
  font-size: 12px;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.entry-edit {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink);
  text-decoration: underline;
  cursor: pointer;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.empty-past {
  text-align: center;
  color: var(--text-soft);
  font-family: 'Inter', sans-serif;
}
.empty-past .dash { font-size: 30px; margin-bottom: 8px; color: var(--ink-light); }
.empty-past p { font-size: 13px; margin: 0; }

/* ---------- Year screen ---------- */
.year-pill-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
.year-pill {
  background: var(--ink);
  color: var(--white);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  border-radius: 30px;
  padding: 10px 30px;
  box-shadow: 0 4px 0 rgba(34,28,138,0.25);
}
.garden-sub {
  text-align: center;
  font-size: 11px;
  color: var(--text-soft);
  font-family: 'Inter', sans-serif;
  margin-bottom: 18px;
}
.seed-link {
  text-align: center;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink);
  text-decoration: underline;
  cursor: pointer;
  margin-bottom: 18px;
  font-family: 'Inter', sans-serif;
}
.daygrid { display: flex; flex-wrap: wrap; gap: 10px 8px; }
.day-cell {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
}
.day-cell.clickable { cursor: pointer; }
.day-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-light); }
.day-cell.today .dot { background: var(--ink); width: 7px; height: 7px; box-shadow: 0 0 0 3px var(--ink-pale); }
.day-cell img { width: 26px; height: 26px; object-fit: contain; mix-blend-mode: multiply; filter: grayscale(1) brightness(1.15) sepia(1) hue-rotate(215deg) saturate(4.5) contrast(1.05); }

.loading, .empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-soft);
  font-size: 12.5px;
  font-family: 'Inter', sans-serif;
}
.empty-state .doodle { font-size: 30px; margin-bottom: 8px; }
.empty-state p { max-width: 260px; margin: 0 auto; line-height: 1.5; }

/* ---------- Draw screen ---------- */
.draw-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: 12px;
  border: 1.5px solid var(--ink-pale);
  background: var(--white);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.draw-date {
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-soft);
}

.canvas-wrap {
  position: relative;
  background: var(--white);
  border-radius: 22px;
  border: 2.5px solid var(--ink);
  overflow: hidden;
  margin-bottom: 14px;
  touch-action: none;
}
canvas { display: block; width: 100%; aspect-ratio: 1/1; touch-action: none; }

.saved-badge {
  position: absolute; top: 10px; right: 10px;
  background: var(--ink); color: var(--white);
  font-size: 10.5px; font-weight: 700;
  padding: 5px 12px; border-radius: 20px;
  display: none; align-items: center; gap: 4px; letter-spacing: 0.3px;
}
.saved-badge.show { display: inline-flex; }

.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.swatches { display: flex; gap: 8px; flex: 1; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
.swatch.selected { border-color: var(--ink); transform: scale(1.15); }

.tool-btn {
  width: 36px; height: 36px; border-radius: 12px;
  border: 1.5px solid var(--ink-pale); background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; font-size: 15px; color: var(--ink);
}
.tool-btn.on { background: var(--ink); color: var(--white); }

.brush-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.brush-row input[type=range] { flex: 1; accent-color: var(--ink); }
.brush-label { font-size: 10.5px; color: var(--text-soft); font-weight: 700; width: 68px; text-transform: uppercase; letter-spacing: 0.4px; }

.save-btn {
  width: 100%; padding: 15px; border-radius: 30px; border: none;
  background: var(--ink); color: var(--white);
  font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13.5px;
  cursor: pointer; letter-spacing: 0.6px; text-transform: uppercase;
}
.hint { text-align: center; font-size: 11.5px; color: var(--text-soft); margin-top: 12px; font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div class="app">

  <!-- DAY SCREEN -->
  <div class="screen active" id="screen-day">
    <div class="day-label" id="dayLabel">Aujourd'hui</div>
    <div class="filmstrip-wrap">
      <div class="center-marker"></div>
      <div class="filmstrip" id="filmstrip"></div>
    </div>
    <div class="day-main" id="dayMain"></div>
  </div>

  <!-- YEAR SCREEN -->
  <div class="screen" id="screen-year">
    <div class="year-pill-wrap"><div class="year-pill" id="yearPill">2026</div></div>
    <div class="garden-sub" id="gardenSub"></div>
    <div class="seed-link" id="seedLink">🌱 Générer des dessins sur les 2 derniers mois</div>
    <div id="gardenContent"><div class="loading">Chargement…</div></div>
  </div>

  <!-- DRAW SCREEN -->
  <div class="screen" id="screen-draw">
    <div class="draw-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="draw-date" id="drawDate"></div>
      <div style="width:36px"></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="saved-badge" id="savedBadge">✓ Enregistré</div>
    </div>
    <div class="toolbar">
      <div class="swatches" id="swatches"></div>
      <button class="tool-btn" id="undoBtn" title="Annuler">↩︎</button>
      <button class="tool-btn" id="eraseBtn" title="Gomme">▢</button>
      <button class="tool-btn" id="clearBtn" title="Tout effacer">✕</button>
    </div>
    <div class="brush-row">
      <span class="brush-label">Épaisseur</span>
      <input type="range" id="brushSize" min="2" max="22" value="6">
    </div>
    <button class="save-btn" id="saveBtn">Enregistrer le dessin</button>
    <div class="hint" id="hintText">Un petit dessin suffit — même trois traits racontent une journée.</div>
  </div>

</div>

<div class="bottom-nav" id="bottomNav">
  <div class="nav-btn" id="navYear" data-screen="year" title="Année">

<script>
/* ---------------- Stockage local (autonome, sans Claude) ---------------- */
(function() {
  const PREFIX = 'carnet_du_jour__';
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error('Key not found: ' + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem(PREFIX + key, value);
      } catch (err) {
        throw new Error('Storage quota exceeded or unavailable');
      }
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX)) {
          const stripped = k.slice(PREFIX.length);
          if (!prefix || stripped.startsWith(prefix)) keys.push(stripped);
        }
      }
      return { keys, prefix, shared: !!shared };
    }
  };
})();

const COLORS = ['#322da3', '#5b56c9', '#9d9ae0', '#221c8a', '#7a76d1', '#ffffff'];
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let drawing = false;
let currentColor = COLORS[0];
let erasing = false;
let brushSize = 6;
let history = [];
let todayKey = null;
let lastPos = null;
let entryCache = {};        // dateStr -> dataUrl
let selectedDate = new Date();

function pad(n) { return String(n).padStart(2, '0'); }
function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateKey(d) { return `day:${toDateStr(d)}`; }
function isSameDay(a, b) { return toDateStr(a) === toDateStr(b); }
function todayStr() { return toDateStr(new Date()); }

const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function shortLabel(d) {
  if (isSameDay(d, new Date())) return "Aujourd'hui";
  const y = new Date(); y.setDate(y.getDate()-1);
  if (isSameDay(d, y)) return 'Hier';
  return `${d.getDate()} ${MOIS[d.getMonth()]}`;
}
function fullLabel(d) {
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

/* ---------------- Canvas drawing ---------------- */
function setupCanvasSize() {
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  ctx.scale(ratio, ratio);
  paintBackground();
}
function paintBackground() {
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width, canvas.height);
  ctx.restore();
}
function pushHistory() {
  history.push(canvas.toDataURL('image/png'));
  if (history.length > 25) history.shift();
}
function restoreFromDataUrl(url, cb) {
  const img = new Image();
  img.onload = () => {
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.restore();
    if (cb) cb();
  };
  img.src = url;
}
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  return { x: clientX - rect.left, y: clientY - rect.top };
}
function startDraw(e) { e.preventDefault(); pushHistory(); drawing = true; lastPos = getPos(e); drawDot(lastPos); }
function drawDot(pos) {
  ctx.beginPath();
  ctx.fillStyle = erasing ? '#ffffff' : currentColor;
  ctx.arc(pos.x, pos.y, brushSize/2, 0, Math.PI*2);
  ctx.fill();
}
function moveDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.strokeStyle = erasing ? '#ffffff' : currentColor;
  ctx.lineWidth = brushSize; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(lastPos.x, lastPos.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
  lastPos = pos;
  hideSavedBadge();
}
function endDraw(e) { if (drawing) e && e.preventDefault(); drawing = false; lastPos = null; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', moveDraw, {passive:false});
canvas.addEventListener('touchend', endDraw, {passive:false});

function buildSwatches() {
  const wrap = document.getElementById('swatches');
  COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i===0 ? ' selected' : '');
    el.style.background = c;
    el.style.boxShadow = c === '#ffffff' ? 'inset 0 0 0 1.5px #c9c6ee' : 'none';
    el.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      currentColor = c; erasing = false;
      document.getElementById('eraseBtn').classList.remove('on');
    });
    wrap.appendChild(el);
  });
}
document.getElementById('brushSize').addEventListener('input', e => brushSize = parseInt(e.target.value, 10));
document.getElementById('undoBtn').addEventListener('click', () => {
  if (!history.length) return;
  restoreFromDataUrl(history.pop());
  hideSavedBadge();
});
document.getElementById('eraseBtn').addEventListener('click', e => {
  erasing = !erasing;
  e.currentTarget.classList.toggle('on', erasing);
});
document.getElementById('clearBtn').addEventListener('click', () => { pushHistory(); paintBackground(); hideSavedBadge(); });
function hideSavedBadge() { document.getElementById('savedBadge').classList.remove('show'); }
function showSavedBadge() { document.getElementById('savedBadge').classList.add('show'); }
function showSaveError() {
  const hint = document.getElementById('hintText');
  hint.textContent = "La sauvegarde a échoué — vérifie ta connexion et réessaie.";
  hint.style.color = '#c94a4a';
  hint.style.fontWeight = '700';
  setTimeout(() => {
    hint.textContent = 'Un petit dessin suffit — même trois traits racontent une journée.';
    hint.style.color = '';
    hint.style.fontWeight = '';
  }, 4000);
}

async function saveToday() {
  const btn = document.getElementById('saveBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Enregistrement…';
  btn.disabled = true;
  try {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    const result = await window.storage.set(todayKey, JSON.stringify({ dataUrl, savedAt: new Date().toISOString() }), false);
    if (!result) throw new Error('Storage returned no result');
    entryCache[todayStr()] = dataUrl;
    showSavedBadge();
    btn.textContent = originalText;
    btn.disabled = false;
    setTimeout(() => { showScreen('day'); renderDayScreen(); }, 450);
  } catch (err) {
    console.error('Erreur de sauvegarde', err);
    btn.textContent = originalText;
    btn.disabled = false;
    showSaveError();
  }
}
document.getElementById('saveBtn').addEventListener('click', saveToday);

async function loadTodayIntoCanvas() {
  try {
    const res = await window.storage.get(todayKey, false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      restoreFromDataUrl(parsed.dataUrl, () => showSavedBadge());
    } else { hideSavedBadge(); }
  } catch (err) { hideSavedBadge(); }
}

/* ---------------- Screens ---------------- */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('bottomNav').style.display = name === 'draw' ? 'none' : 'flex';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
}
document.getElementById('navDay').addEventListener('click', () => { showScreen('day'); renderDayScreen(); });
document.getElementById('navYear').addEventListener('click', () => { showScreen('year'); loadGarden(); });
document.getElementById('backBtn').addEventListener('click', () => { showScreen('day'); renderDayScreen(); });

function openDraw() {
  document.getElementById('drawDate').textContent = "Aujourd'hui";
  showScreen('draw');
  setupCanvasSize();
  loadTodayIntoCanvas();
}

/* ---------------- Day screen rendering ---------------- */
async function ensureEntriesLoaded() {
  try {
    const list = await window.storage.list('day:', false);
    const keys = (list && list.keys) ? list.keys : [];
    await Promise.all(keys.map(async k => {
      const ds = k.replace('day:', '');
      if (entryCache[ds] !== undefined) return;
      try {
        const r = await window.storage.get(k, false);
        entryCache[ds] = JSON.parse(r.value).dataUrl;
      } catch {}
    }));
  } catch (err) {
    console.error('Impossible de charger le carnet', err);
  }
  return entryCache;
}

let scrollTicking = false;

function updateSelectionFromScroll() {
  const strip = document.getElementById('filmstrip');
  const wrapRect = strip.getBoundingClientRect();
  const centerX = wrapRect.left + wrapRect.width / 2;
  let closest = null, closestDist = Infinity;
  strip.querySelectorAll('.film-cell').forEach(cell => {
    const r = cell.getBoundingClientRect();
    const dist = Math.abs((r.left + r.width / 2) - centerX);
    if (dist < closestDist) { closestDist = dist; closest = cell; }
  });
  if (!closest) return;
  strip.querySelectorAll('.film-cell').forEach(c => c.classList.toggle('selected', c === closest));
  const ds = closest.dataset.date;
  if (ds !== toDateStr(selectedDate)) {
    selectedDate = new Date(ds + 'T12:00:00');
    renderDayMain();
  }
}

function buildFilmstrip() {
  const strip = document.getElementById('filmstrip');
  strip.innerHTML = '';
  const days = 60;
  const today = new Date();
  const cells = [];
  for (let i = days; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    cells.push(d);
  }
  cells.forEach(d => {
    const ds = toDateStr(d);
    const cell = document.createElement('div');
    cell.className = 'film-cell' + (isSameDay(d, selectedDate) ? ' selected' : '');
    cell.dataset.date = ds;
    if (entryCache[ds]) {
      const img = document.createElement('img');
      img.src = entryCache[ds];
      cell.appendChild(img);
    } else {
      const dot = document.createElement('div');
      dot.className = 'dot';
      cell.appendChild(dot);
    }
    cell.addEventListener('click', () => {
      cell.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    });
    strip.appendChild(cell);
  });

  strip.removeEventListener('scroll', onFilmstripScroll);
  strip.addEventListener('scroll', onFilmstripScroll, { passive: true });

  const target = strip.querySelector(`[data-date="${toDateStr(selectedDate)}"]`);
  requestAnimationFrame(() => {
    if (target) target.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  });
}

function onFilmstripScroll() {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => { updateSelectionFromScroll(); scrollTicking = false; });
}

function renderDayMain() {
  const main = document.getElementById('dayMain');
  const ds = toDateStr(selectedDate);
  const isToday = ds === todayStr();
  document.getElementById('dayLabel').textContent = shortLabel(selectedDate);

  if (entryCache[ds]) {
    main.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'entry-view';
    wrap.innerHTML = `
      ${isToday ? '<div class="entry-fab" id="fabToday" title="Modifier">+</div>' : ''}
      <img src="${entryCache[ds]}">
      <div class="entry-date">${fullLabel(selectedDate)}</div>
      ${isToday ? '<div class="entry-edit" id="editTodayBtn">Modifier</div>' : ''}
    `;
    main.appendChild(wrap);
    if (isToday) {
      document.getElementById('editTodayBtn').addEventListener('click', openDraw);
      document.getElementById('fabToday').addEventListener('click', openDraw);
    }
  } else if (isToday) {
    main.innerHTML = `
      <div class="plant-cta" id="plantBtn">
        <div class="plant-circle">
          <svg viewBox="0 0 120 120" fill="none" stroke="#322da3" stroke-width="4" stroke-linecap="round">
            <path d="M60,10 C90,8 112,34 110,61 C108,90 83,112 55,110 C25,108 8,80 10,52 C12,25 33,12 60,10 Z"/>
            <line x1="60" y1="42" x2="60" y2="78"/>
            <line x1="42" y1="60" x2="78" y2="60"/>
          </svg>
        </div>
        <div class="plant-label">Planter mon souvenir</div>
      </div>`;
    document.getElementById('plantBtn').addEventListener('click', openDraw);
  } else {
    main.innerHTML = `
      <div class="empty-past">
        <div class="dash">·</div>
        <p>Pas de dessin ce jour-là.</p>
      </div>`;
  }
}

async function renderDayScreen(refresh = true) {
  if (refresh) await ensureEntriesLoaded();
  buildFilmstrip();
  renderDayMain();
}

/* ---------------- Year screen ---------------- */
function isLeap(y) { return (y%4===0 && y%100!==0) || y%400===0; }
function daysInYear(y) { return isLeap(y) ? 366 : 365; }

async function loadGarden() {
  const content = document.getElementById('gardenContent');
  content.innerHTML = '<div class="loading">Chargement…</div>';
  const now = new Date();
  const year = now.getFullYear();
  document.getElementById('yearPill').textContent = year;
  await ensureEntriesLoaded();

  const count = Object.keys(entryCache).filter(k => k.startsWith(String(year))).length;
  if (!count) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="doodle">🌱</div>
        <p>Ton jardin est encore vide. Reviens sur "Aujourd'hui" pour planter ton premier souvenir.</p>
      </div>`;
    document.getElementById('gardenSub').textContent = "chaque point est un jour de l'année";
    return;
  }
  document.getElementById('gardenSub').textContent = `${count} dessin${count>1?'s':''} cette année`;

  const total = daysInYear(year);
  const tStr = todayStr();
  const grid = document.createElement('div');
  grid.className = 'daygrid';

  for (let i = 0; i < total; i++) {
    const d = new Date(year, 0, 1 + i);
    const ds = toDateStr(d);
    const cell = document.createElement('div');
    const isToday = ds === tStr;
    cell.className = 'day-cell' + (isToday ? ' today' : '');
    if (entryCache[ds]) {
      cell.classList.add('clickable');
      const img = document.createElement('img');
      img.src = entryCache[ds];
      cell.appendChild(img);
      cell.addEventListener('click', () => { selectedDate = new Date(d); showScreen('day'); renderDayScreen(false); });
    } else if (ds <= tStr) {
      cell.classList.add('clickable');
      const dot = document.createElement('div');
      dot.className = 'dot';
      cell.appendChild(dot);
      cell.addEventListener('click', () => { selectedDate = new Date(d); showScreen('day'); renderDayScreen(false); });
    } else {
      const dot = document.createElement('div');
      dot.className = 'dot';
      cell.appendChild(dot);
    }
    grid.appendChild(cell);
  }
  content.innerHTML = '';
  content.appendChild(grid);
}

/* ---------------- Demo doodles (child-style drawings) ---------------- */
function jit(v, amt) { return v + (Math.random() - 0.5) * amt; }
function setupDoodleCtx(ctx, color) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
function seg(ctx, x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(jit(x1,5), jit(y1,5)); ctx.lineTo(jit(x2,5), jit(y2,5)); ctx.stroke();
}
function ring(ctx, x, y, r, fill) {
  ctx.beginPath(); ctx.arc(jit(x,4), jit(y,4), r, 0, Math.PI*2);
  fill ? ctx.fill() : ctx.stroke();
}

function doodleHouse(ctx) {
  ctx.beginPath();
  ctx.moveTo(jit(70,4),150); ctx.lineTo(jit(70,4),240); ctx.lineTo(jit(230,4),240); ctx.lineTo(jit(230,4),150); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(jit(55,6),155); ctx.lineTo(jit(150,6),75); ctx.lineTo(jit(245,6),155); ctx.stroke();
  seg(ctx, 135,240,135,195); seg(ctx,135,195,165,195); seg(ctx,165,195,165,240);
  ctx.strokeRect(jit(90,4),175,28,28);
  seg(ctx,90,189,118,189); seg(ctx,104,175,104,203);
  seg(ctx,200,120,200,90); seg(ctx,200,90,215,90); seg(ctx,215,90,215,105);
}
function doodlePerson(ctx) {
  ring(ctx,150,85,28,false);
  ring(ctx,140,80,3,true); ring(ctx,160,80,3,true);
  ctx.beginPath(); ctx.arc(150,95,10,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  seg(ctx,150,113,150,195);
  seg(ctx,150,135,105,165); seg(ctx,150,135,195,165);
  seg(ctx,150,195,110,255); seg(ctx,150,195,190,255);
}
function doodleBird(ctx) {
  ctx.beginPath(); ctx.ellipse(jit(150,4),jit(160,4),55,38,0,0,Math.PI*2); ctx.stroke();
  ring(ctx,110,140,20,false);
  ctx.beginPath(); ctx.moveTo(95,138); ctx.lineTo(70,145); ctx.lineTo(95,152); ctx.stroke();
  ring(ctx,102,134,3,true);
  ctx.beginPath(); ctx.moveTo(160,170); ctx.quadraticCurveTo(210,155,230,180); ctx.stroke();
  seg(ctx,130,196,115,225); seg(ctx,170,196,185,225);
}
function doodleSun(ctx) {
  ring(ctx,150,150,45,false);
  for (let a=0;a<8;a++) {
    const ang = a*Math.PI/4;
    const x1=150+Math.cos(ang)*58, y1=150+Math.sin(ang)*58;
    const x2=150+Math.cos(ang)*88, y2=150+Math.sin(ang)*88;
    seg(ctx,x1,y1,x2,y2);
  }
}
function doodleTree(ctx) {
  seg(ctx,150,260,150,170); seg(ctx,150,260,135,270); seg(ctx,150,260,165,270);
  ring(ctx,150,120,55,false);
  ring(ctx,108,150,32,false);
  ring(ctx,192,150,32,false);
}
function doodleFlower(ctx) {
  seg(ctx,150,260,150,160);
  seg(ctx,150,220,120,235); seg(ctx,150,235,180,250);
  for (let a=0;a<5;a++) {
    const ang = a*(Math.PI*2/5) - Math.PI/2;
    ring(ctx,150+Math.cos(ang)*32, 120+Math.sin(ang)*32, 22, false);
  }
  ring(ctx,150,120,16,false);
}
function doodleCat(ctx) {
  ctx.beginPath(); ctx.ellipse(150,190,60,45,0,0,Math.PI*2); ctx.stroke();
  ring(ctx,150,110,42,false);
  ctx.beginPath(); ctx.moveTo(118,80); ctx.lineTo(108,45); ctx.lineTo(138,72); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(182,80); ctx.lineTo(192,45); ctx.lineTo(162,72); ctx.stroke();
  ring(ctx,135,108,3,true); ring(ctx,165,108,3,true);
  seg(ctx,120,130,90,122); seg(ctx,120,138,88,138);
  seg(ctx,180,130,210,122); seg(ctx,180,138,212,138);
  ctx.beginPath(); ctx.moveTo(205,200); ctx.quadraticCurveTo(240,190,235,150); ctx.stroke();
}
function doodleBalloon(ctx) {
  ring(ctx,150,120,55,false);
  ctx.beginPath(); ctx.moveTo(150,175); ctx.lineTo(150,190); ctx.lineTo(140,200); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(140,200);
  ctx.quadraticCurveTo(160,225,140,250);
  ctx.quadraticCurveTo(120,275,150,290);
  ctx.stroke();
}
function doodleStar(ctx) {
  ctx.beginPath();
  for (let i=0;i<5;i++) {
    const a1 = -Math.PI/2 + i*(Math.PI*2/5);
    const a2 = a1 + Math.PI/5;
    const x1=150+Math.cos(a1)*70, y1=150+Math.sin(a1)*70;
    const x2=150+Math.cos(a2)*28, y2=150+Math.sin(a2)*28;
    if (i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
    ctx.lineTo(x2,y2);
  }
  ctx.closePath(); ctx.stroke();
}
function doodleCloud(ctx) {
  ring(ctx,110,160,32,false); ring(ctx,155,140,40,false); ring(ctx,200,165,30,false);
  ctx.beginPath(); ctx.moveTo(78,175); ctx.lineTo(232,175); ctx.stroke();
}
function doodleFish(ctx) {
  ctx.beginPath(); ctx.ellipse(140,150,70,42,0,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(205,150); ctx.lineTo(245,120); ctx.lineTo(245,180); ctx.closePath(); ctx.stroke();
  ring(ctx,110,140,4,true);
  ctx.beginPath(); ctx.moveTo(130,192); ctx.lineTo(115,215); ctx.stroke();
}
function doodleHeart(ctx) {
  ctx.beginPath();
  ctx.moveTo(150,205);
  ctx.bezierCurveTo(80,150,95,90,150,120);
  ctx.bezierCurveTo(205,90,220,150,150,205);
  ctx.stroke();
}

const DOODLES = [doodleHouse, doodlePerson, doodleBird, doodleSun, doodleTree, doodleFlower, doodleCat, doodleBalloon, doodleStar, doodleCloud, doodleFish, doodleHeart];
const KID_COLORS = ['#322da3','#c9524a','#3f8c53','#e0a63a','#3f6fb8','#a05fb0','#d9754a'];

function renderDoodleDataUrl(fn) {
  const off = document.createElement('canvas');
  off.width = 300; off.height = 300;
  const octx = off.getContext('2d');
  octx.fillStyle = '#ffffff';
  octx.fillRect(0,0,300,300);
  const color = KID_COLORS[Math.floor(Math.random()*KID_COLORS.length)];
  setupDoodleCtx(octx, color);
  fn(octx);
  return off.toDataURL('image/jpeg', 0.85);
}

async function seedDemoEntries() {
  const link = document.getElementById('seedLink');
  link.textContent = 'Génération en cours…';
  await ensureEntriesLoaded();
  const today = new Date();
  const jobs = [];
  for (let i = 1; i <= 60; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ds = toDateStr(d);
    if (entryCache[ds]) continue;
    if (Math.random() < 0.22) continue; // laisse quelques jours vides, plus réaliste
    const fn = DOODLES[Math.floor(Math.random() * DOODLES.length)];
    const dataUrl = renderDoodleDataUrl(fn);
    entryCache[ds] = dataUrl;
    jobs.push(
      window.storage.set('day:' + ds, JSON.stringify({ dataUrl, savedAt: d.toISOString() }), false)
    );
  }
  try {
    await Promise.all(jobs);
    link.textContent = `✓ ${jobs.length} dessins ajoutés`;
    setTimeout(() => { link.style.display = 'none'; }, 2000);
  } catch (err) {
    link.textContent = "Erreur pendant la génération, réessaie";
  }
  loadGarden();
}
document.getElementById('seedLink').addEventListener('click', seedDemoEntries);

/* ---------------- Init ---------------- */
function init() {
  const now = new Date();
  todayKey = dateKey(now);
  buildSwatches();
  renderDayScreen(true);
  window.addEventListener('resize', () => {
    if (!document.getElementById('screen-draw').classList.contains('active')) return;
    const snapshot = canvas.toDataURL('image/png');
    setupCanvasSize();
    restoreFromDataUrl(snapshot);
  });
}
init();
</script>
